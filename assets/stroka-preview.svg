<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Stroka - your Mac's own news channel</title><desc id="desc">Illustration of a personal two-row news ticker, with a name on the left and clock on the right. The text is sample content.</desc>
<rect width="1200" height="420" rx="24" fill="#f3f5f8"/>
<text x="58" y="84" fill="#7b8390" font-size="15" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" letter-spacing="3">YOUR SCREEN. YOUR SOURCES.</text>
<text x="54" y="159" fill="#161c26" font-size="57" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">Your world. On air.</text>
<text x="58" y="204" fill="#626d7b" font-size="23" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">A personal news channel along the edge of your Mac.</text>
<defs><clipPath id="bar"><rect x="48" y="267" width="1104" height="106" rx="16"/></clipPath></defs>
<g clip-path="url(#bar)" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif">
<rect x="48" y="267" width="1104" height="106" fill="#fff"/>
<rect x="48" y="267" width="136" height="106" fill="#cc1531"/>
<text x="116" y="313" fill="white" font-size="21" font-weight="700" text-anchor="middle">YOUR</text><text x="116" y="340" fill="white" font-size="21" font-weight="700" text-anchor="middle">NEWS</text>
<text x="206" y="309" fill="#161c26" font-size="23" font-weight="600">News · Headlines from the publishers you choose</text>
<rect x="773" y="288" width="3" height="25" fill="#cc1531"/><rect x="781" y="288" width="3" height="25" fill="#cc1531"/><rect x="789" y="288" width="3" height="25" fill="#cc1531"/>
<text x="811" y="309" fill="#161c26" font-size="23" font-weight="600">Your messages</text>
<rect x="184" y="328" width="860" height="45" fill="#121b26"/>
<text x="206" y="357" fill="#d8dee9" font-size="18">Markets · Your watchlist, with source and delay labels</text>
<rect x="1044" y="267" width="108" height="106" fill="#202833"/>
<text x="1098" y="315" fill="white" font-size="28" font-weight="600" text-anchor="middle">12:45</text><text x="1098" y="343" fill="#bcc6d2" font-size="11" text-anchor="middle">TUE, 17 NOV</text>
