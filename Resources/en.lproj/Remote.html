<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stroka · Remote</title>
<style>body{font:18px system-ui;background:#edf2f4;color:#132d46;max-width:520px;margin:24px auto;padding:20px}h1{font-size:32px}button,textarea{font:inherit;box-sizing:border-box;border:1px solid #b9c9d1;border-radius:12px;padding:16px;width:100%;margin:6px 0;background:white;color:#132d46}textarea{height:140px}button:active{background:#7bd8d0}.row{display:flex;gap:8px}small{color:#566d7e}</style>
<h1>Stroka</h1><p>Control your Mac display</p><div class="row"><button onclick="go('previous')">← Previous</button><button onclick="go('next')">Next →</button></div>
<button onclick="go('pause')">Pause / Resume</button><textarea id="message" aria-label="Announcement message" placeholder="Announcement message"></textarea><button onclick="go('urgent',document.querySelector('textarea').value)">Show Announcement</button><button onclick="go('clear')">Resume Feed</button><button onclick="go('stop')">Stop Display</button><p id="status" role="status" aria-live="polite"></p><small>The remote works while enabled in Stroka. Keep this link private.</small>
<script>async function go(action,text=''){try{const r=await fetch(location.pathname+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,text})});document.getElementById('status').textContent=r.ok?"Command sent":"Couldn’t reach your Mac"}catch(e){document.getElementById('status').textContent="Couldn’t reach your Mac"}}</script></html>
