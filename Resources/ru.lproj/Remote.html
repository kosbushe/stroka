<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stroka · Remote</title>
<style>body{font:18px system-ui;background:#edf2f4;color:#132d46;max-width:520px;margin:24px auto;padding:20px}h1{font-size:32px}button,textarea{font:inherit;box-sizing:border-box;border:1px solid #b9c9d1;border-radius:12px;padding:16px;width:100%;margin:6px 0;background:white;color:#132d46}textarea{height:140px}button:active{background:#7bd8d0}.row{display:flex;gap:8px}small{color:#566d7e}</style>
<h1>Stroka</h1><p>Управление экраном Mac</p><div class="row"><button onclick="go('previous')">← Назад</button><button onclick="go('next')">Дальше →</button></div>
<button onclick="go('pause')">Пауза / продолжить</button><textarea id="message" aria-label="Сообщение для табло" placeholder="Сообщение для табло"></textarea><button onclick="go('urgent',document.querySelector('textarea').value)">Показать сообщение</button><button onclick="go('clear')">Вернуть ленту</button><button onclick="go('stop')">Завершить показ</button><p id="status" role="status" aria-live="polite"></p><small>Пульт работает, пока включён в Stroka. Не передавайте ссылку посторонним.</small>
<script>async function go(action,text=''){try{const r=await fetch(location.pathname+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,text})});document.getElementById('status').textContent=r.ok?"Команда отправлена":"Нет связи с Mac"}catch(e){document.getElementById('status').textContent="Нет связи с Mac"}}</script></html>
